<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ghv - GitHub Release 下载代理</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 720px; margin: 0 auto; padding: 40px 20px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  p.desc { color: #8b949e; margin-top: 0; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin: 16px 0; }
  label { display: block; font-size: 14px; color: #8b949e; margin-bottom: 8px; }
  input[type=text] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button, a.btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #30363d; background: #238636; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary { background: #21262d; }
  button:hover, a.btn:hover { filter: brightness(1.15); }
  #out { word-break: break-all; font-size: 13px; background: #0d1117; border: 1px dashed #30363d; border-radius: 8px; padding: 12px; margin-top: 12px; min-height: 44px; color: #79c0ff; }
  code { background: #21262d; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .hint { font-size: 13px; color: #8b949e; line-height: 1.8; }
</style>
</head>
<body>
  <h1>ghv · GitHub Release 下载代理</h1>
  <p class="desc">把 <code>github.com</code> 换成当前域名，服务端代你下载并返回文件。</p>

  <div class="card">
    <label>粘贴 GitHub Release 下载链接</label>
    <input id="in" type="text" placeholder="https://github.com/owner/repo/releases/download/v1.0/app.zip" />
    <div class="row">
      <button onclick="convert()">生成代理链接</button>
      <button class="secondary" onclick="go()">直接下载</button>
    </div>
    <div id="out">转换后的链接会显示在这里…</div>
  </div>

  <div class="card hint">
    <div>直连用法（替换域名即可）：</div>
    <div><code>https://github.com/a/b/releases/download/v1.0/f.zip</code></div>
    <div>→ <code><span id="host"></span>/a/b/releases/download/v1.0/f.zip</code></div>
    <br />
    <div>也支持 archive 包：<code>/owner/repo/archive/refs/heads/main.zip</code></div>
    <div>或显式接口：<code>/api/proxy?url=...</code>、<code>/api/owner/repo/...</code></div>
  </div>

<script>
  document.getElementById('host').textContent = location.origin;
  function parseInput() {
    const v = document.getElementById('in').value.trim();
    if (!v) { alert('请先粘贴链接'); return null; }
    let u;
    try { u = new URL(v); }
    catch { alert('链接格式不正确'); return null; }
    // github.com 或已经是本站域名的链接都接受
    const path = u.pathname + u.search + u.hash;
    return location.origin + path;
  }
  function convert() {
    const r = parseInput();
    if (!r) return;
    const out = document.getElementById('out');
    out.innerHTML = '';
    const a = document.createElement('a');
    a.href = r; a.textContent = r; a.style.color = '#79c0ff';
    out.appendChild(a);
  }
  function go() {
    const r = parseInput();
    if (r) location.href = r;
  }
</script>
</body>
</html>
